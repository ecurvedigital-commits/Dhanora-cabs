# ──────────────────────────────────────────────────────────
# Dehradun Platform — Local Development Services
# ──────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: dehradun-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dehradun
      POSTGRES_PASSWORD: dehradun_dev
      POSTGRES_DB: dehradun_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dehradun -d dehradun_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test database (isolated)
  postgres-test:
    image: postgres:16-alpine
    container_name: dehradun-postgres-test
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dehradun
      POSTGRES_PASSWORD: dehradun_test
      POSTGRES_DB: dehradun_test

volumes:
  pgdata:
    driver: local
